# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]
    paths:
      - docs/**
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'
          submodules: 'true'
      - name: Support
        uses: actions/checkout@v7
        with:
          repository: masesgroup/CommonTools
          path: CommonTools
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Setup IndexNow # Generate files dynamically to prevent them from being leaked in public repositories.
        run: echo ${{ secrets.INDEXNOW_KEY }} > ./docs/${{ secrets.INDEXNOW_KEY }}.txt
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs/
          destination: ./_site
      - name: Sitemap lastmod replacer
        shell: pwsh
        run: ./CommonTools/scripts/SitemapLastmodReplacer.ps1 -baseUrl https://jcoreflector.masesgroup.com -baseFolder ${{ github.workspace }}/docs/ -inSitemapFile ${{ github.workspace }}/_site/sitemap.xml -outSitemapFile ${{ github.workspace }}/sitemap.xml
      - name: Sitemap split
        shell: pwsh
        run: |
          $ws = "${{ github.workspace }}"
          $base = "https://jcoreflector.masesgroup.com"
          $rx = "^$([regex]::Escape($base))/(net[^/]+)/"
          $data = [xml](Get-Content -Raw "$ws/sitemap.xml")
          $out = New-Item -ItemType Directory "$ws/split" -Force
          $groups = $data.urlset.url | Group-Object { if ($_.loc -match $rx) { $Matches[1] } else { 'main' } }
          $idx = @('<?xml version="1.0" encoding="UTF-8"?>', '<sitemapindex xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">')
          foreach ($g in $groups) {
            $name = "sitemap-$($g.Name).xml"
            $lines = @('<?xml version="1.0" encoding="UTF-8"?>', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">')
            $lines += $g.Group | ForEach-Object {
              "<url><loc>$([Security.SecurityElement]::Escape($_.loc))</loc><lastmod>$($_.lastmod)</lastmod></url>"
            }
            $lines += '</urlset>'
            Set-Content "$out/$name" $lines -Encoding utf8
            $idx += "<sitemap><loc>$base/$name</loc></sitemap>"
            Write-Host "$name : $($g.Count) url"
          }
          $idx += '</sitemapindex>'
          Set-Content "$out/sitemap.xml" $idx -Encoding utf8
      - run: sudo cp ${{ github.workspace }}/split/*.xml ${{ github.workspace }}/_site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
